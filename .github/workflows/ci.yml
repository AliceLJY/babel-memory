name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: bun test + build + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run build
      - name: typecheck
        run: bunx tsc --noEmit
      - name: dist must not inline deps or leak build-machine paths (issue #1 guard)
        run: |
          if grep -rq "/Users/" dist/; then
            echo "::error::build-machine absolute path leaked into dist"; exit 1
          fi
          # external deps must stay as dynamic imports, not inlined source
          for dep in jieba-wasm wordcut tinyld; do
            if ! grep -q "\"$dep\"" dist/index.js; then
              echo "::error::$dep specifier missing from dist — inlined or dropped?"; exit 1
            fi
          done
          # an inlined bundle is ~1MB; external build is ~20KB
          size=$(wc -c < dist/index.js)
          if [ "$size" -gt 200000 ]; then
            echo "::error::dist/index.js is ${size} bytes — optional deps likely inlined again"; exit 1
          fi

  node-compat:
    name: Node ${{ matrix.node }} CJS/ESM smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install
      - run: bun run build
      - name: CJS require smoke (the Node <22 breakage guard)
        run: |
          node -e "
            const m = require('./dist/index.cjs');
            if (m.detectLanguage('机器学习') !== 'zh') process.exit(1);
            if (!m.tokenizeForFts('机器学习', 'zh')) process.exit(1);
            console.log('CJS require OK on', process.version);
          "
      - name: ESM import smoke (no MODULE_TYPELESS warning tolerated)
        run: |
          out=$(node --no-warnings=ExperimentalWarning -e "
            import('./dist/index.js').then(m => {
              if (m.detectLanguage('東京タワーです') !== 'ja') process.exit(1);
              console.log('ESM import OK on', process.version);
            });
          " 2>&1)
          echo "$out"
          if echo "$out" | grep -q "MODULE_TYPELESS_PACKAGE_JSON"; then
            echo "double-parse warning detected"; exit 1
          fi

  no-optional-deps:
    name: zero-dependency fallback chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: run smoke in a dir with no node_modules
        run: |
          mkdir -p /tmp/bm-smoke
          cp -r dist scripts/smoke-no-optional.mjs /tmp/bm-smoke/
          cd /tmp/bm-smoke
          node smoke-no-optional.mjs
